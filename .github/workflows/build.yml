name: Build RichmorConfig

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger manually from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false      # one OS failing doesn't cancel the others
      matrix:
        include:
          - os: windows-latest
            arch: x64
            out:  RichmorConfig-win64.exe
            tag:  win64
          - os: windows-latest
            arch: x86
            out:  RichmorConfig-win32.exe
            tag:  win32
          - os: ubuntu-latest
            arch: x64
            out:  RichmorConfig-linux.deb        # double-click to install (pulls WebKitGTK)
            tag:  linux
          - os: macos-latest      # Apple Silicon runner
            arch: arm64
            out:  RichmorConfig-macos-arm64.zip   # unzip -> drag .app to Applications -> double-click
            tag:  macos-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      # ── native webview backends (pywebview needs a per-OS GUI backend) ──
      - name: Linux WebKitGTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config \
                                  gir1.2-gtk-3.0 gir1.2-webkit2-4.1

      - name: Base deps
        shell: bash
        run: pip install aiohttp imageio-ffmpeg pyinstaller pywebview

      - name: Windows backend (EdgeChromium/WebView2)
        if: runner.os == 'Windows'
        run: pip install pythonnet

      - name: macOS backend (WKWebView)
        if: runner.os == 'macOS'
        run: pip install pyobjc-framework-WebKit

      - name: Linux backend (WebKitGTK)
        if: runner.os == 'Linux'
        run: pip install "pygobject<3.50"   # 3.50+ needs girepository-2.0; <3.50 uses the 1.0 bindings we installed

      # ── build the one-file app (spec bundles HTML/JS/assets + ffmpeg) ──
      - name: Build
        run: pyinstaller richmor_config_app.spec --clean --noconfirm

      # ── package per OS so end users just double-click (no chmod, no terminal) ──
      - name: Package Windows (.exe)
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/RichmorConfig.exe "dist/${{ matrix.out }}"

      - name: Package macOS (.app -> .zip)
        if: runner.os == 'macOS'
        run: cd dist && zip -r -y "${{ matrix.out }}" RichmorConfig.app

      - name: Package Linux (.deb)
        if: runner.os == 'Linux'
        run: bash package_deb.sh "dist/${{ matrix.out }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.tag }}
          path: dist/${{ matrix.out }}
